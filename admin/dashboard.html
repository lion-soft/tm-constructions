
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#081018">

    <title>TM Constructions - Admin Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .admin-page {
            min-height: 100vh;
            padding: 140px 0 80px;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 40px;
        }

        .admin-label {
            color: var(--gold);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: clamp(34px, 5vw, 56px);
        }

        .admin-header p {
            color: var(--muted);
            margin-top: 10px;
        }

        .logout-btn {
            padding: 12px 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255,255,255,.04);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            border-color: var(--gold);
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
            align-items: start;
        }

        .admin-card {
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255,255,255,.04);
            backdrop-filter: blur(20px);
        }

        .admin-card h2 {
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 15px;
            border-radius: 11px;
            border: 1px solid var(--border);
            outline: none;
            background: rgba(255,255,255,.05);
            color: #fff;
            font: inherit;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--gold);
        }

        .image-preview {
            width: 100%;
            height: 190px;
            margin-top: 12px;
            border-radius: 14px;
            border: 1px dashed var(--border);
            display: none;
            object-fit: cover;
        }

        .upload-btn {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 800;
            background: var(--gold);
            color: #081018;
        }

        .upload-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: rgba(70, 200, 120, .12);
            border: 1px solid rgba(70, 200, 120, .3);
            color: #7ee2a8;
        }

        .message.error {
            display: block;
            background: rgba(255, 80, 80, .12);
            border: 1px solid rgba(255, 80, 80, .3);
            color: #ff8585;
        }

        .projects-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
        }

        .projects-title h2 {
            margin: 0;
        }

        .project-count {
            color: var(--muted);
            font-size: 14px;
        }

        .admin-projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .admin-project {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(255,255,255,.025);
        }

        .admin-project-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
        }

        .admin-project-content {
            padding: 18px;
        }

        .admin-project-content h3 {
            margin: 0 0 7px;
            font-size: 19px;
        }

        .admin-project-location {
            color: var(--gold);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .admin-project-description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .delete-btn {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: 1px solid rgba(255,80,80,.3);
            border-radius: 10px;
            background: rgba(255,80,80,.08);
            color: #ff8585;
            cursor: pointer;
            font-weight: 700;
        }

        .delete-btn:hover {
            background: rgba(255,80,80,.15);
        }

        .empty-admin {
            grid-column: 1 / -1;
            padding: 50px 20px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 16px;
        }

        .loading-admin {
            grid-column: 1 / -1;
            padding: 50px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 900px) {

            .admin-layout {
                grid-template-columns: 1fr;
            }

            .admin-projects {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .admin-page {
                padding: 120px 0 60px;
            }

            .admin-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .admin-card {
                padding: 22px;
            }

            .admin-projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="admin-page">

        <div class="container">

            <div class="admin-header">

                <div>
                    <div class="admin-label">
                        TM CONSTRUCTIONS
                    </div>

                    <h1>Admin Dashboard</h1>

                    <p>
                        Manage your completed construction projects.
                    </p>
                </div>

                <button
                    class="logout-btn"
                    id="logoutBtn">
                    Logout
                </button>

            </div>


            <div class="admin-layout">


                <section class="admin-card">

                    <h2>Add New Project</h2>

                    <form id="projectForm">

                        <div class="form-group">

                            <label for="title">
                                Project Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                placeholder="Example: Modern House Construction"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="location">
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                placeholder="Example: Gampaha, Sri Lanka"
                            >

                        </div>


                        <div class="form-group">

                            <label for="description">
                                Description
                            </label>

                            <textarea
                                id="description"
                                placeholder="Describe the construction project..."
                            ></textarea>

                        </div>


                        <div class="form-group">

                            <label for="image">
                                Project Photo
                            </label>

                            <input
                                type="file"
                                id="image"
                                accept="image/jpeg,image/png,image/webp"
                                required
                            >

                            <img
                                id="imagePreview"
                                class="image-preview"
                                alt="Image preview"
                            >

                        </div>


                        <button
                            type="submit"
                            class="upload-btn"
                            id="uploadBtn">

                            Add Project

                        </button>

                        <div
                            id="message"
                            class="message">
                        </div>

                    </form>

                </section>

                <section class="admin-card">

                    <div class="projects-title">

                        <h2>
                            Projects
                        </h2>

                        <span
                            class="project-count"
                            id="projectCount">
                            0 projects
                        </span>

                    </div>


                    <div
                        class="admin-projects"
                        id="adminProjects">

                        <div class="loading-admin">
                            Loading projects...
                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config.js"></script>


    <script>

        const supabaseClient =
            window.supabase.createClient(
                window.TM_CONFIG.SUPABASE_URL,
                window.TM_CONFIG.SUPABASE_ANON_KEY
            );


        const projectForm =
            document.getElementById("projectForm");

        const uploadBtn =
            document.getElementById("uploadBtn");

        const message =
            document.getElementById("message");

        const imageInput =
            document.getElementById("image");

        const imagePreview =
            document.getElementById("imagePreview");

        const adminProjects =
            document.getElementById("adminProjects");

        const projectCount =
            document.getElementById("projectCount");

        const logoutBtn =
            document.getElementById("logoutBtn");


        async function checkAdmin() {

            const {
                data: { user }
            } = await supabaseClient.auth.getUser();

            if (!user) {

                window.location.href = "index.html";

                return false;
            }

            return true;
        }

        imageInput.addEventListener("change", () => {

            const file = imageInput.files[0];

            if (!file) {

                imagePreview.style.display = "none";

                return;
            }

            imagePreview.src =
                URL.createObjectURL(file);

            imagePreview.style.display = "block";

        });


        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        async function loadProjects() {

            adminProjects.innerHTML = `
                <div class="loading-admin">
                    Loading projects...
                </div>
            `;


            const {
                data,
                error
            } = await supabaseClient
                .from("projects")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                adminProjects.innerHTML = `
                    <div class="empty-admin">
                        ${error.message}
                    </div>
                `;

                return;
            }


            projectCount.textContent =
                `${data.length} project${data.length === 1 ? "" : "s"}`;


            if (!data.length) {

                adminProjects.innerHTML = `
                    <div class="empty-admin">
                        No projects added yet.
                    </div>
                `;

                return;
            }


            adminProjects.innerHTML = "";


            data.forEach(project => {

                const image =
                    project.image_urls?.[0] || "";


                const card =
                    document.createElement("article");

                card.className =
                    "admin-project";


                card.innerHTML = `

                    ${image ? `
                        <img
                            src="${image}"
                            class="admin-project-image"
                            alt="${project.title}"
                        >
                    ` : ""}

                    <div class="admin-project-content">

                        <div class="admin-project-location">
                            ${escapeHTML(project.location || "Sri Lanka")}
                        </div>

                        <h3>
                            ${escapeHTML(project.title)}
                        </h3>

                        <p class="admin-project-description">
                            ${escapeHTML(project.description || "")}
                        </p>

                        <button
                            class="delete-btn"
                            data-id="${project.id}"
                            data-images='${JSON.stringify(project.image_urls || [])}'>
                            Delete Project
                        </button>

                    </div>
                `;


                adminProjects.appendChild(card);

            });


            document
                .querySelectorAll(".delete-btn")
                .forEach(button => {

                    button.addEventListener(
                        "click",
                        () => deleteProject(button)
                    );

                });

        }


        projectForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                const title =
                    document.getElementById("title")
                        .value.trim();

                const location =
                    document.getElementById("location")
                        .value.trim();

                const description =
                    document.getElementById("description")
                        .value.trim();

                const file =
                    imageInput.files[0];


                if (!file) {

                    showMessage(
                        "Please select a project photo.",
                        "error"
                    );

                    return;
                }


                uploadBtn.disabled = true;
                uploadBtn.textContent =
                    "Uploading...";


                try {


                    const extension =
                        file.name
                            .split(".")
                            .pop()
                            .toLowerCase();


                    const fileName =
                        `${crypto.randomUUID()}.${extension}`;


                    const filePath =
                        `projects/${fileName}`;


                    const {
                        error: uploadError
                    } = await supabaseClient
                        .storage
                        .from(
                            window.TM_CONFIG.STORAGE_BUCKET
                        )
                        .upload(
                            filePath,
                            file,
                            {
                                cacheControl: "3600",
                                upsert: false
                            }
                        );


                    if (uploadError) {

                        throw uploadError;
                    }


                    const {
                        data: publicData
                    } = supabaseClient
                        .storage
                        .from(
                            window.TM_CONFIG.STORAGE_BUCKET
                        )
                        .getPublicUrl(filePath);


                    const imageURL =
                        publicData.publicUrl;



                    const {
                        error: databaseError
                    } = await supabaseClient
                        .from("projects")
                        .insert({

                            title: title,

                            location: location,

                            description: description,

                            image_urls: [
                                imageURL
                            ]

                        });


                    if (databaseError) {

                        throw databaseError;
                    }


                    showMessage(
                        "Project added successfully!",
                        "success"
                    );


                    projectForm.reset();

                    imagePreview.style.display =
                        "none";


                    await loadProjects();

                } catch (error) {

                    console.error(error);

                    showMessage(
                        error.message ||
                        "Something went wrong.",
                        "error"
                    );

                } finally {

                    uploadBtn.disabled = false;

                    uploadBtn.textContent =
                        "Add Project";

                }

            }
        );

        async function deleteProject(button) {

            const id =
                button.dataset.id;


            if (!confirm(
                "Are you sure you want to delete this project?"
            )) {

                return;
            }


            button.disabled = true;
            button.textContent = "Deleting...";


            try {

                const images =
                    JSON.parse(
                        button.dataset.images || "[]"
                    );


                const {
                    error: databaseError
                } = await supabaseClient
                    .from("projects")
                    .delete()
                    .eq("id", id);


                if (databaseError) {

                    throw databaseError;
                }



                if (images.length) {

                    const paths =
                        images.map(url => {

                            const marker =
                                "/project-images/";

                            const index =
                                url.indexOf(marker);

                            if (index === -1) {
                                return null;
                            }

                            return url
                                .substring(
                                    index + marker.length
                                );

                        }).filter(Boolean);


                    if (paths.length) {

                        await supabaseClient
                            .storage
                            .from(
                                window.TM_CONFIG.STORAGE_BUCKET
                            )
                            .remove(paths);

                    }

                }


                await loadProjects();

            } catch (error) {

                console.error(error);

                alert(
                    error.message ||
                    "Failed to delete project."
                );

                button.disabled = false;
                button.textContent =
                    "Delete Project";

            }

        }


        logoutBtn.addEventListener(
            "click",
            async () => {

                await supabaseClient.auth.signOut();

                window.location.href =
                    "index.html";

            }
        );

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        (async () => {

            const loggedIn =
                await checkAdmin();

            if (loggedIn) {

                await loadProjects();

            }

        })();

    </script>

</body>

</html>
